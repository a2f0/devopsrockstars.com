name: Github Actions

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - name: bun audit
        run: bun audit --audit-level=critical --prod
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: pre-commit
        run: |
          pip install pre-commit==4.6.2
          pre-commit install
          pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch
      - name: Unit tests
        run: bun run unit
      - run: bun run ci-headless
      - name: Upload hat preview failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hat-preview-failures
          path: ${{ runner.temp }}/hat-preview-failures/
          if-no-files-found: ignore
          retention-days: 7

  deployment-preview:
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/production' &&
      github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile
      - run: bun scripts/deploy.ts staging --dry-run
      - run: bun scripts/deploy.ts prod --dry-run

  deploy-staging:
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: code-quality
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    continue-on-error: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Deploy staging to Cloudflare
        run: bun run deploy:staging

  deploy-production:
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    continue-on-error: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Deploy production to Cloudflare
        run: bun run deploy:prod
