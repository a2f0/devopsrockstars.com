repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
      # Unified diff context lines intentionally start with a space.
      exclude: \.patch$
    - id: check-merge-conflict
    - id: forbid-new-submodules
    - id: mixed-line-ending
    - id: no-commit-to-branch
      args: ['--branch', 'production']
- repo: local
  hooks:
    - id: check-feature-flags
      name: check-feature-flags
      entry: bun run flags:check
      pass_filenames: false
      language: system
    - id: check-for-unpinned-dependencies
      name: check-for-unpinned-dependencies
      entry: bun scripts/check-for-unpinned-dependencies.mjs
      pass_filenames: false
      language: system
    - id: check-agent-skills-in-sync
      name: check-agent-skills-in-sync
      entry: bun scripts/check-agent-skills-in-sync.mjs
      pass_filenames: false
      language: system
    - id: check-shared-agent-skills
      name: check-shared-agent-skills
      entry: bun run agents:check
      pass_filenames: false
      language: system
    - id: biome format
      name: biome format
      entry: bun run --bun biome format
      pass_filenames: false
      language: system
    - id: biome lint
      name: biome lint
      entry: bun run --bun biome lint
      pass_filenames: false
      language: system
    - id: audit
      name: bun audit
      entry: bun audit --audit-level=critical --prod
      pass_filenames: false
      language: system
    - id: tsc
      name: tsc
      entry: bun run compile
      pass_filenames: false
      language: system
    - id: markdownlint
      name: markdownlint
      entry: bun run --bun markdownlint-cli2
      pass_filenames: false
      language: system
    - id: knip
      name: knip
      entry: bun run --bun knip
      pass_filenames: false
      language: system
